[project]
name = "replica-ppt-agent-backend"
version = "0.1.0"
description = "Standalone backend for replica PPT agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "pydantic>=2.8.0",
  "python-pptx>=1.0.2",
  "python-dotenv>=1.0.1",
  "pymupdf>=1.26.0",
  "pillow>=10.4.0",
  "numpy>=2.1.0",
  "requests>=2.32.0",
  "openpyxl>=3.1.0",
  "mammoth>=1.8.0",
  "markdownify>=1.2.0",
  "ebooklib>=0.19",
  "nbconvert>=7.16.0",
  "curl-cffi>=0.13.0",
  "svglib>=1.5.1",
  "reportlab>=4.4.4",
  "openai>=2.3.0",
  "google-genai>=1.47.0",
  "edge-tts>=7.2.3",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
  "app",
  "README.md",
  "pyproject.toml",
]
