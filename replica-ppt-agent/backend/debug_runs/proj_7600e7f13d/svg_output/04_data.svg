<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="120" fill="#1E3A8A"/>
<text x="90" y="76" font-size="46" fill="#FFFFFF" font-weight="700" font-family="Arial, Microsoft YaHei">投入产出评估：建立可量化的ROI框架</text>
<rect x="70" y="150" width="1140" height="520" rx="18" fill="#F8FAFC" stroke="#DBEAFE"/>

<text x="100" y="228" font-size="24" fill="#0F172A" font-weight="400" font-family="Arial, Microsoft YaHei">指标1</text>
<rect x="280" y="200" width="540" height="34" rx="8" fill="#E2E8F0"/>
<rect x="280" y="200" width="520" height="34" rx="8" fill="#2563EB"/>
<text x="840" y="224" font-size="20" fill="#1E293B" font-weight="700" font-family="Arial, Microsoft YaHei">投入项包括模型与平台费用、系统集成</text><text x="840" y="250" font-size="20" fill="#1E293B" font-weight="700" font-family="Arial, Microsoft YaHei">成本、数据治理投入、培训与变革管理</text>

<text x="100" y="318" font-size="24" fill="#0F172A" font-weight="400" font-family="Arial, Microsoft YaHei">指标2</text>
<rect x="280" y="290" width="540" height="34" rx="8" fill="#E2E8F0"/>
<rect x="280" y="290" width="520" height="34" rx="8" fill="#2563EB"/>
<text x="840" y="314" font-size="20" fill="#1E293B" font-weight="700" font-family="Arial, Microsoft YaHei">产出项包括人工工时节省、错误率下降</text><text x="840" y="340" font-size="20" fill="#1E293B" font-weight="700" font-family="Arial, Microsoft YaHei">、交付周期缩短、转化率提升与客户满</text>

<text x="100" y="408" font-size="24" fill="#0F172A" font-weight="400" font-family="Arial, Microsoft YaHei">指标3</text>
<rect x="280" y="380" width="540" height="34" rx="8" fill="#E2E8F0"/>
<rect x="280" y="380" width="520" height="34" rx="8" fill="#2563EB"/>
<text x="840" y="404" font-size="20" fill="#1E293B" font-weight="700" font-family="Arial, Microsoft YaHei">建议采用“单场景ROI+组合场景收益”</text><text x="840" y="430" font-size="20" fill="#1E293B" font-weight="700" font-family="Arial, Microsoft YaHei">双层测算，兼顾短期回报与长期能力沉</text>

<text x="100" y="498" font-size="24" fill="#0F172A" font-weight="400" font-family="Arial, Microsoft YaHei">指标4</text>
<rect x="280" y="470" width="540" height="34" rx="8" fill="#E2E8F0"/>
<rect x="280" y="470" width="520" height="34" rx="8" fill="#2563EB"/>
<text x="840" y="494" font-size="20" fill="#1E293B" font-weight="700" font-family="Arial, Microsoft YaHei">核心指标可设置为单位任务成本、处理</text><text x="840" y="520" font-size="20" fill="#1E293B" font-weight="700" font-family="Arial, Microsoft YaHei">时长、一次通过率与人均产出提升比例</text>

