<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
<text x="80" y="90" font-size="48" fill="#0F172A" font-weight="700" font-family="Arial, Microsoft YaHei">试点策略：以小步快跑验证可行性</text>
<line x1="80" y1="118" x2="1200" y2="118" stroke="#CBD5E1" />

<rect x="80" y="180" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="80" y="180" width="10" height="120" rx="6" fill="#2563EB" />
<text x="110" y="232" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">试点目标应明确聚焦1-2个关键业务问题，</text><text x="110" y="266" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">避免范围过大导致周期拉长</text>

<rect x="80" y="330" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="80" y="330" width="10" height="120" rx="6" fill="#2563EB" />
<text x="110" y="382" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">试点成功标准需提前设定，如工时节省20%</text><text x="110" y="416" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">、响应时效提升30%或满意度提升10%</text>


<rect x="700" y="180" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="700" y="180" width="10" height="120" rx="6" fill="#0EA5E9" />
<text x="730" y="232" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">建议采用“4-8周快速试点”模式，覆盖需</text><text x="730" y="266" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">求定义、方案搭建、业务验证与复盘优化</text>

<rect x="700" y="330" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="700" y="330" width="10" height="120" rx="6" fill="#0EA5E9" />
<text x="730" y="382" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">试点阶段重点不是追求完美，而是验证技术</text><text x="730" y="416" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">可用性、业务适配性与收益可兑现性</text>

</svg>