<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#F1F5F9"/>
<text x="90" y="100" font-size="48" fill="#0F172A" font-weight="700" font-family="Arial, Microsoft YaHei">实施建议：三步推进AI提效落地</text>
<rect x="90" y="150" width="1100" height="220" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="130" y="240" font-size="36" fill="#0F172A" font-weight="400" font-family="Arial, Microsoft YaHei">“第一步，识别高价值场景并建立统一ROI评估口径，确保项目选</text><text x="130" y="288" font-size="36" fill="#0F172A" font-weight="400" font-family="Arial, Microsoft YaHei">择有依据”</text>

<circle cx="170" cy="406" r="8" fill="#2563EB"/>
<text x="195" y="414" font-size="28" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">第二步，以短周期试点验证业务价值，形成可复制的方法与标准</text>

<circle cx="170" cy="476" r="8" fill="#2563EB"/>
<text x="195" y="484" font-size="28" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">第三步，围绕组织、数据、流程与治理体系建设长期能力，实现规模化提效</text>

<circle cx="170" cy="546" r="8" fill="#2563EB"/>
<text x="195" y="554" font-size="28" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">建议管理层以“价值导向+分阶段投入”方式推进，降低风险并提升成功率</text>

</svg>