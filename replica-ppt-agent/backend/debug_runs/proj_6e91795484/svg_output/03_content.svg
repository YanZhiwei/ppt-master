<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
<text x="80" y="90" font-size="48" fill="#0F172A" font-weight="700" font-family="Arial, Microsoft YaHei">AI提效的核心价值：降本、增效、提质</text>
<line x1="80" y1="118" x2="1200" y2="118" stroke="#CBD5E1" />

<rect x="80" y="180" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="80" y="180" width="10" height="120" rx="6" fill="#2563EB" />
<text x="110" y="232" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">降本：减少重复性人工投入，优化流程与资</text><text x="110" y="266" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">源配置</text>

<rect x="80" y="330" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="80" y="330" width="10" height="120" rx="6" fill="#2563EB" />
<text x="110" y="382" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">提质：提升内容准确性、服务一致性与决策</text><text x="110" y="416" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">支持能力</text>


<rect x="700" y="180" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="700" y="180" width="10" height="120" rx="6" fill="#0EA5E9" />
<text x="730" y="232" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">增效：缩短响应周期，提高交付速度与协同</text><text x="730" y="266" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">效率</text>

<rect x="700" y="330" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="700" y="330" width="10" height="120" rx="6" fill="#0EA5E9" />
<text x="730" y="382" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">优先聚焦高频、标准化、数据基础较好的业</text><text x="730" y="416" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">务环节</text>

</svg>