<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<text x="80" y="92" font-size="46" fill="#0F172A" font-weight="700" font-family="Arial, Microsoft YaHei">组织能力建设：技术、业务、治理三位一体</text>
<rect x="90" y="170" width="500" height="470" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
<rect x="690" y="170" width="500" height="470" rx="18" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="130" y="220" font-size="32" fill="#0F172A" font-weight="700" font-family="Arial, Microsoft YaHei">现状</text>
<text x="720" y="220" font-size="32" fill="#1D4ED8" font-weight="700" font-family="Arial, Microsoft YaHei">目标</text>
<text x="130" y="245" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">• 技术能力：模型选型、平台集成、数据</text><text x="130" y="275" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">接口与安全能力建设</text><text x="130" y="335" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">• 业务能力：场景识别、流程重构、需求</text><text x="130" y="365" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">管理与价值追踪</text><text x="130" y="425" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">• 治理能力：权限管理、内容审核、合规</text><text x="130" y="455" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">审查与风险预案</text>
<text x="720" y="245" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">• 建立跨部门协同机制，明确业务、IT与</text><text x="720" y="275" font-size="24" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">管理层职责分工</text>
</svg>