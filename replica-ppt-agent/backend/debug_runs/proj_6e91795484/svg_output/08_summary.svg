<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#F1F5F9"/>
<text x="90" y="100" font-size="48" fill="#0F172A" font-weight="700" font-family="Arial, Microsoft YaHei">实施建议与下一步行动</text>
<rect x="90" y="150" width="1100" height="220" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="130" y="240" font-size="36" fill="#0F172A" font-weight="400" font-family="Arial, Microsoft YaHei">“第一步：梳理候选场景，建立价值与难度评估清单”</text>

<circle cx="170" cy="406" r="8" fill="#2563EB"/>
<text x="195" y="414" font-size="28" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">第二步：选择1至2个高优先级场景开展试点验证</text>

<circle cx="170" cy="476" r="8" fill="#2563EB"/>
<text x="195" y="484" font-size="28" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">第三步：同步搭建治理机制与培训体系，提升组织采纳率</text>

<circle cx="170" cy="546" r="8" fill="#2563EB"/>
<text x="195" y="554" font-size="28" fill="#1E293B" font-weight="400" font-family="Arial, Microsoft YaHei">第四步：形成标准化方法论，逐步复制到更多业务单元</text>

</svg>