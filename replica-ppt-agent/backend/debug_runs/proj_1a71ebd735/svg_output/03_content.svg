<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
<text x="80" y="90" font-size="48" fill="#0F172A" font-weight="700" font-family="Arial, Microsoft YaHei">为什么企业现在必须关注AI提效</text>
<line x1="80" y1="118" x2="1200" y2="118" stroke="#CBD5E1" />

<rect x="80" y="180" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="80" y="180" width="10" height="120" rx="6" fill="#2563EB" />
<text x="110" y="248" font-size="28" fill="#1E293B" font-family="Arial, Microsoft YaHei">市场竞争加剧，企业对效率、响应速度与成本控制要求持续提升</text>

<rect x="80" y="330" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="80" y="330" width="10" height="120" rx="6" fill="#2563EB" />
<text x="110" y="398" font-size="28" fill="#1E293B" font-family="Arial, Microsoft YaHei">AI正从辅助工具升级为组织级生产力基础设施</text>


<rect x="700" y="180" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="700" y="180" width="10" height="120" rx="6" fill="#0EA5E9" />
<text x="730" y="248" font-size="28" fill="#1E293B" font-family="Arial, Microsoft YaHei">生成式AI与自动化技术成熟，应用门槛显著降低</text>

<rect x="700" y="330" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
<rect x="700" y="330" width="10" height="120" rx="6" fill="#0EA5E9" />
<text x="730" y="398" font-size="28" fill="#1E293B" font-family="Arial, Microsoft YaHei">率先布局的企业更易形成流程、数据与人才优势</text>

</svg>