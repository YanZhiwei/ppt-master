<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="90" y="150" font-size="44" fill="#1F1F1F" font-weight="700" font-family="Arial, Microsoft YaHei">AI提效实施路径与投入产出逻辑</text><text x="90" y="214" font-size="24" fill="#1F1F1F" font-weight="700" font-family="Arial, Microsoft YaHei">数据表</text><text x="90" y="250" font-size="22" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">指标1: 第一阶段：选择高频、标准化、可量化的场景进行试点</text><text x="90" y="282" font-size="22" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">指标2: 第二阶段：打通数据、流程与系统，实现局部流程自动化</text><text x="90" y="314" font-size="22" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">指标3: 第三阶段：形成平台化能力，推动跨部门复制与规模应用</text><text x="90" y="346" font-size="22" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">指标4: 以效率提升、错误率下降、响应时长缩短和人效增长作为核心评估指标</text></svg>