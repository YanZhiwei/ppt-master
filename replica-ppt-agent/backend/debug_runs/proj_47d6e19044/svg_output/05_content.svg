<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="90" y="150" font-size="44" fill="#1F1F1F" font-weight="700" font-family="Arial, Microsoft YaHei">典型应用场景：办公与管理提效</text><text x="90" y="214" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">1. 文档生成：会议纪要、方案初稿、报告摘要自动生成</text><text x="90" y="250" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">2. 知识问答：企业制度、产品资料、项目经验快速检索与回答</text><text x="90" y="286" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">3. 数据处理：报表整理、信息提取、基础分析自动化完成</text><text x="90" y="322" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">4. 项目协同：任务拆解、进度跟踪、风险提示与复盘支持</text></svg>