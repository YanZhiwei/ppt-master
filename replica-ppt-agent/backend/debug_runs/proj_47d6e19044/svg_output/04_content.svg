<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="90" y="150" font-size="44" fill="#1F1F1F" font-weight="700" font-family="Arial, Microsoft YaHei">AI提效的核心价值框架</text><text x="90" y="214" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">1. 降本：减少重复性工作投入，优化人力与时间成本</text><text x="90" y="250" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">2. 增效：缩短任务周期，提高处理速度与协同效率</text><text x="90" y="286" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">3. 提质：通过标准化输出提升内容、服务与决策质量</text><text x="90" y="322" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">4. 增收：支持销售转化、客户运营与产品创新，带来新增业务机会</text></svg>