<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="90" y="150" font-size="44" fill="#1F1F1F" font-weight="700" font-family="Arial, Microsoft YaHei">典型应用场景：业务与客户提效</text><text x="90" y="214" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">1. 营销场景：活动文案、客户分层、线索触达内容快速生成</text><text x="90" y="250" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">2. 销售场景：客户洞察、话术建议、商机跟进与方案辅助</text><text x="90" y="286" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">3. 客服场景：智能问答、工单分流、标准回复与服务质检</text><text x="90" y="322" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">4. 运营场景：用户反馈分析、流程优化建议与异常预警</text></svg>