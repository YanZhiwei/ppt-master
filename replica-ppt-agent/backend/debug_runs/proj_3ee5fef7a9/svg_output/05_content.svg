<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="90" y="150" font-size="44" fill="#1F1F1F" font-weight="700" font-family="Arial, Microsoft YaHei">典型应用场景一：办公与管理效率提升</text><text x="90" y="214" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">1. 会议纪要自动生成，缩短整理与同步时间</text><text x="90" y="250" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">2. 文档撰写与PPT初稿生成，提高方案输出效率</text><text x="90" y="286" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">3. 知识库问答与信息检索，减少跨部门沟通成本</text><text x="90" y="322" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">4. 流程审批与任务跟进自动提醒，提升协同效率</text></svg>