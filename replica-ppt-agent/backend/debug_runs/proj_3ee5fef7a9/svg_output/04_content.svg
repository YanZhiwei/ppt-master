<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text x="90" y="150" font-size="44" fill="#1F1F1F" font-weight="700" font-family="Arial, Microsoft YaHei">AI提效的核心价值框架</text><text x="90" y="214" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">1. 降本：减少重复性工作投入，优化人力与时间成本</text><text x="90" y="250" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">2. 增效：提升内容生成、数据处理与决策支持速度</text><text x="90" y="286" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">3. 提质：降低人为差错，增强流程标准化与输出一致性</text><text x="90" y="322" font-size="24" fill="#3A3A3A" font-weight="400" font-family="Arial, Microsoft YaHei">4. 赋能：释放员工精力，聚焦高价值创造与创新工作</text></svg>