name: replica-ppt-agent-ci

on:
  push:
    paths:
      - "replica-ppt-agent/**"
  pull_request:
    paths:
      - "replica-ppt-agent/**"

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replica-ppt-agent/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Sync deps (uv)
        run: uv sync
      - name: Run tests
        run: uv run pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replica-ppt-agent/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: replica-ppt-agent/frontend/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
